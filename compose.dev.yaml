services:
  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: walx
      POSTGRES_PASSWORD: walx
      POSTGRES_DB: walx
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walx -d walx"]
      interval: 2s
      timeout: 3s
      retries: 15
